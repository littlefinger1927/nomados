apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-manager
  namespace: nomados
  labels:
    app.kubernetes.io/name: browser-manager
    app.kubernetes.io/part-of: nomados-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: browser-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browser-manager
    spec:
      containers:
        - name: browser-manager
          image: nomados/browser-manager:latest
          ports:
            - containerPort: 50054
              protocol: TCP
          env:
            - name: BROWSER_MANAGER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: nomados-config
                  key: BROWSER_MANAGER_ADDR
            - name: CHROMIUM_BIN_PATH
              valueFrom:
                configMapKeyRef:
                  name: nomados-config
                  key: CHROMIUM_BIN_PATH
            - name: BROWSER_PROFILE_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: nomados-config
                  key: BROWSER_PROFILE_BASE_PATH
          envFrom:
            - configMapRef:
                name: nomados-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 50054
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 50054
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: browser-manager
  namespace: nomados
  labels:
    app.kubernetes.io/name: browser-manager
    app.kubernetes.io/part-of: nomados-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: browser-manager
  ports:
    - port: 50054
      targetPort: 50054
      protocol: TCP
      name: grpc