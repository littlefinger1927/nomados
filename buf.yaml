          - packages/shared-types/proto/nomados/session/v1/session.proto
          - packages/shared-types/proto/nomados/workspace/v1/workspace.proto
        RPC_RESPONSE_STANDARD_NAME:
          - packages/shared-types/proto/nomados/file/v1/file.proto
          - packages/shared-types/proto/nomados/session/v1/session.proto
          - packages/shared-types/proto/nomados/vault/v1/vault.proto
          - packages/shared-types/proto/nomados/workspace/v1/workspace.proto
