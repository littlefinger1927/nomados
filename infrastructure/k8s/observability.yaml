apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability
  namespace: nomados
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/part-of: nomados-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability
    spec:
      containers:
        - name: observability
          image: nomados/observability:latest
          ports:
            - containerPort: 9090
              protocol: TCP
          env:
            - name: OBSERVABILITY_ADDR
              valueFrom:
                configMapKeyRef:
                  name: nomados-config
                  key: OBSERVABILITY_ADDR
          envFrom:
            - configMapRef:
                name: nomados-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: observability
  namespace: nomados
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/part-of: nomados-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: observability
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: http