[package]
name = "nomados-tauri"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nomados"
path = "src/main.rs"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"
nomados-crypto = { path = "../../../packages/crypto" }
dirs = "5"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2" }