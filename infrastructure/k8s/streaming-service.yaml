apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-service
  namespace: nomados
  labels:
    app.kubernetes.io/name: streaming-service
    app.kubernetes.io/part-of: nomados-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: streaming-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streaming-service
    spec:
      containers:
        - name: streaming-service
          image: nomados/streaming-service:dev
          ports:
            - containerPort: 50055
              protocol: TCP
          env:
            - name: STREAMING_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: nomados-config
                  key: STREAMING_SERVICE_ADDR
            - name: TURN_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: nomados-config
                  key: TURN_SERVER_URL
            - name: TURN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: nomados-config
                  key: TURN_USERNAME
            - name: TURN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nomados-secrets
                  key: TURN_PASSWORD
            - name: TURN_REALM
              valueFrom:
                configMapKeyRef:
                  name: nomados-config
                  key: TURN_REALM
          envFrom:
            - configMapRef:
                name: nomados-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            grpc:
              port: 50055
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50055
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
  namespace: nomados
  labels:
    app.kubernetes.io/name: streaming-service
    app.kubernetes.io/part-of: nomados-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: streaming-service
  ports:
    - port: 50055
      targetPort: 50055
      protocol: TCP
      name: grpc