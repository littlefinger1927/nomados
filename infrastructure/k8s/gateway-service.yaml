apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: nomados
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: nomados-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: nomados/gateway-service:dev
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: GATEWAY_ADDR
              valueFrom:
                configMapKeyRef:
                  name: nomados-config
                  key: GATEWAY_ADDR
            - name: AUTH_SERVICE_CLIENT_ADDR
              value: "auth-service:50051"
            - name: SESSION_SERVICE_CLIENT_ADDR
              value: "session-service:50052"
            - name: WORKSPACE_SERVICE_CLIENT_ADDR
              value: "workspace-orchestrator:50053"
            - name: BROWSER_SERVICE_CLIENT_ADDR
              value: "browser-manager:50054"
            - name: STREAMING_SERVICE_CLIENT_ADDR
              value: "streaming-service:50055"
            - name: FILE_SERVICE_CLIENT_ADDR
              value: "file-service:50056"
            - name: VAULT_SERVICE_CLIENT_ADDR
              value: "vault-service:50057"
            - name: SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: nomados-secrets
                  key: SIGNING_SECRET
          envFrom:
            - configMapRef:
                name: nomados-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: nomados
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: nomados-platform
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http