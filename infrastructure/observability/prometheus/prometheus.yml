global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "nomados-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-service:8080"]

  - job_name: "nomados-auth"
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:50051"]

  - job_name: "nomados-session"
    metrics_path: /metrics
    static_configs:
      - targets: ["session-service:50052"]

  - job_name: "nomados-workspace-orchestrator"
    metrics_path: /metrics
    static_configs:
      - targets: ["workspace-orchestrator:50053"]

  - job_name: "nomados-browser-manager"
    metrics_path: /metrics
    static_configs:
      - targets: ["browser-manager:50054"]

  - job_name: "nomados-streaming"
    metrics_path: /metrics
    static_configs:
      - targets: ["streaming-service:50055"]

  - job_name: "nomados-file"
    metrics_path: /metrics
    static_configs:
      - targets: ["file-service:50056"]

  - job_name: "nomados-vault"
    metrics_path: /metrics
    static_configs:
      - targets: ["vault-service:50057"]

  - job_name: "nomados-observability"
    metrics_path: /metrics
    static_configs:
      - targets: ["observability:9090"]