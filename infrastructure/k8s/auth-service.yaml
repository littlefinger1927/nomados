apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nomados
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: nomados-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
    spec:
      containers:
        - name: auth-service
          image: nomados/auth-service:dev
          ports:
            - containerPort: 50051
              protocol: TCP
          env:
            - name: AUTH_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: nomados-config
                  key: AUTH_SERVICE_ADDR
            - name: SESSION_SERVICE_CLIENT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: nomados-config
                  key: SESSION_SERVICE_CLIENT_ADDR
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nomados-secrets
                  key: DATABASE_PASSWORD
            - name: DATABASE_URL
              value: "postgres://nomados:$(DATABASE_PASSWORD)@postgres:5432/nomados?sslmode=disable"
          envFrom:
            - configMapRef:
                name: nomados-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nomados
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: nomados-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc