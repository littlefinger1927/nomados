services:
  # ─── Infrastructure ───────────────────────────────────────────────
  # Secret defaults are embedded below for local dev. For production,
  # create infrastructure/docker/.env with generated secrets:
  #   ./infrastructure/scripts/generate-secrets.sh

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nomados
      POSTGRES_USER: nomados
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-nomados_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomados"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: nomados
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nomados_dev_key}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: --js --store_dir /data -m 8222
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./turn/turnserver.conf:/etc/turnserver.conf
    command: ["-c", "/etc/turnserver.conf"]

  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Application Services ─────────────────────────────────────────

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "50051:50051"
    environment:
      - DATABASE_URL=postgres://nomados:${DATABASE_PASSWORD:-nomados_dev}@postgres:5432/nomados?sslmode=disable
      - AUTH_SERVICE_ADDR=:50051
      - SESSION_SERVICE_CLIENT_ADDR=session-service:50052
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-https://localhost}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      session-service:
        condition: service_started

  session-service:
    build:
      context: ../..
      dockerfile: services/session-service/Dockerfile
    ports:
      - "50052:50052"
    environment:
      - DATABASE_URL=postgres://nomados:${DATABASE_PASSWORD:-nomados_dev}@postgres:5432/nomados?sslmode=disable
      - NATS_URL=nats://nats:4222
      - SESSION_SERVICE_ADDR=:50052
      - SIGNING_SECRET=${SIGNING_SECRET:-nomados-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  workspace-orchestrator:
    build:
      context: ../..
      dockerfile: services/workspace-orchestrator/Dockerfile
    ports:
      - "50053:50053"
    environment:
      - DATABASE_URL=postgres://nomados:${DATABASE_PASSWORD:-nomados_dev}@postgres:5432/nomados?sslmode=disable
      - NATS_URL=nats://nats:4222
      - WORKSPACE_SERVICE_ADDR=:50053
      - DOCKER_ENABLED=true
      - WORKSPACE_IMAGE=chromium/chromium:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  file-service:
    build:
      context: ../..
      dockerfile: services/file-service/Dockerfile
    ports:
      - "50056:50056"
    environment:
      - DATABASE_URL=postgres://nomados:${DATABASE_PASSWORD:-nomados_dev}@postgres:5432/nomados?sslmode=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=nomados
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-nomados_dev}
      - MINIO_BUCKET=nomados-files
      - MINIO_USE_SSL=false
      - FILE_SERVICE_ADDR=:50056
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  browser-manager:
    build:
      context: ../..
      dockerfile: services/browser-manager/Dockerfile
    ports:
      - "50054:50054"
    environment:
      - NATS_URL=nats://nats:4222
      - BROWSER_MANAGER_ADDR=:50054
      - CHROMIUM_BIN_PATH=/usr/bin/chromium-browser
      - BROWSER_PROFILE_BASE_PATH=/home/appuser/browser-profiles
    depends_on:
      nats:
        condition: service_healthy

  streaming-service:
    build:
      context: ../..
      dockerfile: services/streaming-service/Dockerfile
    ports:
      - "50055:50055"
    environment:
      - NATS_URL=nats://nats:4222
      - STREAMING_SERVICE_ADDR=:50055
      - TURN_SERVER_URL=turn:coturn:3478
      - TURN_USERNAME=nomados
      - TURN_PASSWORD=${TURN_PASSWORD:-nomados_dev_secret}
      - TURN_REALM=nomados.dev
    depends_on:
      nats:
        condition: service_healthy

  vault-service:
    build:
      context: ../..
      dockerfile: services/vault-service/Dockerfile
    ports:
      - "50057:50057"
    environment:
      - NATS_URL=nats://nats:4222
      - VAULT_SERVICE_ADDR=:50057
      - SESSION_SERVICE_CLIENT_ADDR=session-service:50052
    depends_on:
      nats:
        condition: service_healthy

  observability:
    build:
      context: ../..
      dockerfile: services/observability/Dockerfile
    ports:
      - "9090:9090"
    environment:
      - NATS_URL=nats://nats:4222
      - OBSERVABILITY_ADDR=:9090
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway-service:
    build:
      context: ../..
      dockerfile: services/gateway-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_ADDR=:8080
      - AUTH_SERVICE_CLIENT_ADDR=auth-service:50051
      - SESSION_SERVICE_CLIENT_ADDR=session-service:50052
      - WORKSPACE_SERVICE_CLIENT_ADDR=workspace-orchestrator:50053
      - BROWSER_SERVICE_CLIENT_ADDR=browser-manager:50054
      - STREAMING_SERVICE_CLIENT_ADDR=streaming-service:50055
      - FILE_SERVICE_CLIENT_ADDR=file-service:50056
      - VAULT_SERVICE_CLIENT_ADDR=vault-service:50057
      - SIGNING_SECRET=${SIGNING_SECRET:-nomados-dev-secret}
      - RATE_LIMIT_RPS=100
      - RATE_LIMIT_BURST=200
      - CORS_ALLOWED_ORIGINS=http://web-desktop:3000,http://localhost:3000,https://localhost:3000
    depends_on:
      - auth-service
      - session-service
      - workspace-orchestrator
      - browser-manager
      - streaming-service
      - file-service
      - vault-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web-desktop:
    build:
      context: ../..
      dockerfile: apps/web-desktop/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=https://localhost
    depends_on:
      - gateway-service
      - caddy

  # ─── Observability Stack ──────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - gateway-service
      - auth-service
      - session-service
      - workspace-orchestrator
      - browser-manager
      - streaming-service
      - file-service
      - vault-service
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  nats_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data: