syntax = "proto3";

package nomados.file.v1;

option go_package = "github.com/nomados/nomados/packages/shared-types/gen/file/v1";

import "nomados/common/v1/common.proto";
import "google/api/annotations.proto";

service FileService {
  rpc Upload(stream UploadRequest) returns (UploadResponse) {
    option (google.api.http) = {post: "/v1/file/upload" body: "*"};
  }
  rpc Download(DownloadRequest) returns (stream DownloadResponse) {
    option (google.api.http) = {post: "/v1/file/download" body: "*"};
  }
  rpc List(ListFilesRequest) returns (ListFilesResponse) {
    option (google.api.http) = {post: "/v1/file/list" body: "*"};
  }
  rpc Delete(DeleteFileRequest) returns (nomados.common.v1.Empty) {
    option (google.api.http) = {post: "/v1/file/delete" body: "*"};
  }
}

message UploadRequest {
  oneof data {
    FileMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message FileMetadata {
  nomados.common.v1.UUID workspace_id = 1;
  string filename = 2;
  int64 size = 3;
  string content_type = 4;
}

message UploadResponse {
  nomados.common.v1.UUID file_id = 1;
  string encrypted_path = 2;
}

message DownloadRequest {
  nomados.common.v1.UUID file_id = 1;
  nomados.common.v1.UUID workspace_id = 2;
}

message DownloadResponse {
  bytes chunk = 1;
}

message ListFilesRequest {
  nomados.common.v1.UUID workspace_id = 1;
}

message ListFilesResponse {
  repeated FileInfo files = 1;
}

message FileInfo {
  nomados.common.v1.UUID id = 1;
  string filename = 2;
  int64 size = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

message DeleteFileRequest {
  nomados.common.v1.UUID file_id = 1;
  nomados.common.v1.UUID workspace_id = 2;
}