name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Build all Go modules
        run: |
          go build ./services/auth-service/... \
            ./services/session-service/... \
            ./services/workspace-orchestrator/... \
            ./services/file-service/... \
            ./services/browser-manager/... \
            ./services/streaming-service/... \
            ./services/vault-service/... \
            ./services/observability/... \
            ./services/gateway-service/... \
            ./packages/auth-sdk/... \
            ./packages/logging/... \
            ./packages/shared-types/...

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Run short tests
        run: |
          go test -short -timeout 5m \
            ./services/auth-service/... \
            ./services/session-service/... \
            ./services/workspace-orchestrator/... \
            ./services/file-service/... \
            ./services/browser-manager/... \
            ./services/streaming-service/... \
            ./services/vault-service/... \
            ./services/observability/... \
            ./services/gateway-service/... \
            ./packages/auth-sdk/... \
            ./packages/logging/...

  go-vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Vet services and packages
        run: |
          go vet \
            ./services/auth-service/... \
            ./services/session-service/... \
            ./services/workspace-orchestrator/... \
            ./services/file-service/... \
            ./services/browser-manager/... \
            ./services/streaming-service/... \
            ./services/vault-service/... \
            ./services/observability/... \
            ./services/gateway-service/... \
            ./packages/auth-sdk/... \
            ./packages/logging/...

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/web-desktop
        run: npm ci

      - name: Install UI components dependencies
        working-directory: packages/ui-components
        run: npm install

      - name: Build
        working-directory: apps/web-desktop
        run: npm run build

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/web-desktop
        run: npm ci

      - name: Install UI components dependencies
        working-directory: packages/ui-components
        run: npm install

      - name: Lint
        working-directory: apps/web-desktop
        run: npm run lint

  integration-compile:
    name: Integration Tests Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Verify integration tests compile
        working-directory: tests/integration
        run: go build ./...