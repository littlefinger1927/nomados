apiVersion: v1
kind: Secret
metadata:
  name: nomados-secrets
  namespace: nomados
  labels:
    app.kubernetes.io/name: nomados
    app.kubernetes.io/part-of: nomados-platform
type: Opaque
data:
  # Base64-encoded placeholder values — replace with production secrets
  # Use: echo -n 'your-secret' | base64
  # Or: kubectl create secret generic nomados-secrets --from-literal=DATABASE_PASSWORD=...
  DATABASE_PASSWORD: bm9tYWRvc19kZXY=               # nomados_dev
  SIGNING_SECRET: bm9tYWRvcy1kZXYtc2VjcmV0         # nomados-dev-secret
  MINIO_ROOT_PASSWORD: bm9tYWRvc19kZXZfa2V5         # nomados_dev_key
  MINIO_SECRET_KEY: bm9tYWRvc19kZXZfa2V5           # nomados_dev_key
  TURN_PASSWORD: bm9tYWRvc19kZXZfc2VjcmV0         # nomados_dev_secret