[package]
name = "nomados-crypto"
version = "0.1.0"
edition = "2021"

[lib]
name = "nomados_crypto"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"

[dev-dependencies]