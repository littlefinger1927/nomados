apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-service
  namespace: nomados
  labels:
    app.kubernetes.io/name: vault-service
    app.kubernetes.io/part-of: nomados-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-service
    spec:
      containers:
        - name: vault-service
          image: nomados/vault-service:dev
          ports:
            - containerPort: 50057
              protocol: TCP
          env:
            - name: VAULT_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: nomados-config
                  key: VAULT_SERVICE_ADDR
          envFrom:
            - configMapRef:
                name: nomados-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            grpc:
              port: 50057
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50057
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: nomados
  labels:
    app.kubernetes.io/name: vault-service
    app.kubernetes.io/part-of: nomados-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vault-service
  ports:
    - port: 50057
      targetPort: 50057
      protocol: TCP
      name: grpc